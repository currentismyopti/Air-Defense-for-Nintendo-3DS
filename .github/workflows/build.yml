# Builds AirDefense.cia in the cloud and publishes it with a QR code for FBI's Remote Install.
name: Build 3DS
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the game folder
        run: |
          # Works whether the files are at the top of the repository or inside a folder.
          dir=$(dirname "$(find . -path '*/meta/app.rsf' -not -path './.git/*' | head -n 1)")
          dir=$(dirname "$dir")
          echo "Game folder: $dir"
          echo "GAME_DIR=$dir" >> "$GITHUB_ENV"
      - name: Compile (devkitPro)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w "/w/$GAME_DIR" devkitpro/devkitarm:latest make
      - name: Package the .cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GAME_DIR"
          sudo chown -R "$(id -u)" .
          python3 tools/get_tools.py
          mkdir -p build
          tools/bin/bannertool makebanner -i meta/banner.png -a meta/banner.wav -o build/banner.bnr
          tools/bin/makerom -f cia -o AirDefense.cia -elf AirDefense.elf -rsf meta/app.rsf -target t -exefslogo \
              -icon AirDefense.smdh -banner build/banner.bnr
          cp AirDefense.cia AirDefense.3dsx "$GITHUB_WORKSPACE/"
      - name: QR code
        run: |
          pip3 install --break-system-packages qrcode pillow || pip3 install qrcode pillow
          python3 -c "import qrcode; qrcode.make('https://github.com/${{ github.repository }}/releases/download/latest/AirDefense.cia').save('AirDefense-QR.png')"
      - uses: actions/upload-artifact@v4
        with:
          name: AirDefense
          path: |
            AirDefense.cia
            AirDefense.3dsx
            AirDefense-QR.png
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Air Defense Command (3DS)
          body: |
            Install with FBI: **Remote Install > Scan QR Code** and scan `AirDefense-QR.png`,
            or **Manually enter URL**: `https://github.com/${{ github.repository }}/releases/download/latest/AirDefense.cia`
          files: |
            AirDefense.cia
            AirDefense.3dsx
            AirDefense-QR.png
